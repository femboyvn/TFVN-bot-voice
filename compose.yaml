name: tfvn-bot-voice

services:
  bot:
    image: ${BOT_IMAGE:-tfvn-bot-voice:local}
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - soundboard-data:/data/soundboard
    environment:
      SOUNDBOARD_DATA_DIR: /data/soundboard
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  soundboard-data:
