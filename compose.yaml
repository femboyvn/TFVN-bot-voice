name: tfvn-bot-voice

services:
  bot:
    image: ${BOT_IMAGE:-tfvn-bot-voice:local}
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
