services:
  bot:
    image: ghcr.io/femboyvn/tfvn-bot-voice:latest
    container_name: tfvn-bot-voice
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
